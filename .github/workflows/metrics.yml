name: Generate metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Thomaz-Castro
          committer_branch: output
          filename: metrics.svg
          template: classic
          base: header
          config_timezone: America/Sao_Paulo
          config_display: large
          config_octicon: yes
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_ignored: tcl, jupyter notebook, css, scss, dockerfile, shell
          plugin_languages_colors: "0:38bdae, 1:f7c948, 2:ff6b6b, 3:a78bfa, 4:60a5fa, 5:fb923c"
          plugin_languages_details: percentage
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h1, h2, h3 { color: #38bdae; }
            .field svg { fill: #8b949e; }
            .calendar .day { outline: 1px solid rgba(255,255,255,.04); }
            :root { --color-calendar-graph-day-bg: #161b22; --color-calendar-graph-day-L1-bg: #0e4429; --color-calendar-graph-day-L2-bg: #006d32; --color-calendar-graph-day-L3-bg: #26a641; --color-calendar-graph-day-L4-bg: #39d353; }
