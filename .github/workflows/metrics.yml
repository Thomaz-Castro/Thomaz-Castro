name: Generate metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Thomaz-Castro
          committer_branch: output
          filename: metrics.svg
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_octicon: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_ignored: tcl, jupyter notebook, css, scss, dockerfile, shell
          plugin_languages_colors: "0:38bdae, 1:f7c948, 2:ff6b6b, 3:a78bfa, 4:60a5fa, 5:fb923c"
          plugin_languages_details: percentage
